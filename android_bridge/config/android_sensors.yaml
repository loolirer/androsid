/android_battery:
  ros__parameters:
    msg_type: sensor_msgs/msg/BatteryState
    socket_path: /run/androsid/battery.sock
    topic: battery_state
    frame_id: ''
    qos_overrides:
      /battery_state:
        publisher:
          reliability: reliable
          durability: transient_local
          history: keep_last
          depth: 1

