/android_imu:
  ros__parameters:
    msg_type: sensor_msgs/msg/Imu
    socket_path: /run/androsid/imu.sock
    topic: imu/data_raw
    frame_id: imu_link
    qos_overrides:
      /imu/data_raw:
        publisher:
          reliability: best_effort
          durability: volatile
          history: keep_last
          depth: 5

