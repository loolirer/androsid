/mobile_sensors:
  ros__parameters:
    host: 127.0.0.1
    port: 9870
    imu_frame: imu_link
    gps_frame: gps_link
    camera_names:
      - front_0
      - rear_0
    qos_overrides:
      /imu/data_raw:
        publisher:
          reliability: best_effort
          durability: volatile
          history: keep_last
          depth: 5
      /imu/mag:
        publisher:
          reliability: best_effort
          durability: volatile
          history: keep_last
          depth: 5
      /gps/fix:
        publisher:
          reliability: reliable
          durability: volatile
          history: keep_last
          depth: 5
      /camera/front_0/image_raw/compressed:
        publisher:
          reliability: best_effort
          durability: volatile
          history: keep_last
          depth: 5
      /camera/rear_0/image_raw/compressed:
        publisher:
          reliability: best_effort
          durability: volatile
          history: keep_last
          depth: 5
      /battery_state:
        publisher:
          reliability: reliable
          durability: transient_local
          history: keep_last
          depth: 1
